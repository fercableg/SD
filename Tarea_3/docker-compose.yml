services:
  redis-db:
    image: redis:alpine
    container_name: redis-db
    # Aqui cambiar el tamaño del cache y la politica de almacenamiento
    command: >
      redis-server
      --maxmemory 50mb
      --maxmemory-policy allkeys-lfu
    ports:
      - "6379:6379"
    networks:
      - sd-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    networks:
      - sd-network
    depends_on:
      - redis-db

  generador_de_respuestas:
    build: ./generador_de_respuestas
    container_name: generador_de_respuestas
    volumes:
      - ./967_buildings.csv:/app/967_buildings.csv  # mounts CSV correctly
    ports:
      - "8001:8001"
    networks:
      - sd-network

  cache:
    build: ./cache
    container_name: cache
    depends_on:
      - redis-db
      - generador_de_respuestas
    ports:
      - "8000:8000"
    networks:
      - sd-network

  generador_de_trafico:
    build: ./generador_de_trafico
    container_name: generador_de_trafico
    depends_on:
      - cache
    environment:
      - RESPUESTAS_URL=http://cache:8000
    stdin_open: true
    tty: true
    networks:
      - sd-network

  # Kafka en modo KRaft (sin Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sd-network

  # Inicializador de tópicos (se ejecuta una sola vez)
  init-kafka:
    image: confluentinc/cp-kafka:latest
    container_name: init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Esperando a que Kafka esté listo...';
        cub kafka-ready -b kafka:9092 1 30;
        echo 'Creando tópicos...';
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas-principal --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas-reintento --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas-dlq --partitions 3 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic metrics-topic --partitions 1 --replication-factor 1;
        echo 'Tópicos creados. Saliendo.';
      "
    networks:
      - sd-network

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - sd-network

  # Consumidor principal
  consumidor:
    build: ./consumidor
    container_name: consumidor
    depends_on:
      - kafka
      - cache
      - generador_de_respuestas
      - init-kafka
    command: python -u consumer.py
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CACHE_URL: http://cache:8000
      TOPIC_PRINCIPAL: consultas-principal
      TOPIC_REINTENTO: consultas-reintento
      MAX_RETRIES: 3
      GROUP_ID: grupo-consumidores
    networks:
      - sd-network

  # Consumidor de reintentos (secundario)
  consumidor_reintento:
    build: ./consumidor_secundario
    container_name: consumidor_reintento
    depends_on:
      - kafka
      - init-kafka
    command: python -u consumidorSecundario.py
    environment:
      PYTHONUNBUFFERED: 1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CACHE_URL: http://cache:8000
      TOPIC_REINTENTO: consultas-reintento
      TOPIC_DLQ: consultas-dlq
      MAX_RETRIES: 3
      RETRY_DELAY: 2
      GROUP_ID: grupo-reintentos
    networks:
      - sd-network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - sd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - sd-network
    depends_on:
      elasticsearch:
        condition: service_healthy

    # Spark Streaming Job
  spark:
    build: ./spark_streaming
    container_name: spark
    ports:
      - "4040:4040"
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    command: ["spark-submit", "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.elasticsearch:elasticsearch-spark-30_2.12:8.11.0", "--master", "local[*]", "/opt/spark/jobs/spark_job.py"]
    networks:
      - sd-network

networks:
  sd-network:
    driver: bridge